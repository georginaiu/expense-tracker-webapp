<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expenses</title>
<style>
:root{--bg:#F4F5F1;--card:#fff;--ink:#2B2D28;--sub:#9AA096;--accent:#7FA687;--deep:#5D8566;--line:#EDEEE9;--handle:#D8DAD3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default}.app{min-height:100vh;max-width:420px;margin:auto;padding-bottom:100px;position:relative}
.header{padding:24px 20px 8px}.title{font-size:22px;font-weight:600}.date{font-size:13px;color:var(--sub);margin-top:2px}
.period-wrap{padding:8px 20px}.period{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}.period button{border:0;background:transparent;border-radi[...]
.pad{padding:12px 20px}.card{background:var(--card);border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.total{padding:20px}.label{font-size:12px;color:var(--sub);margin-bottom:4px}.total-num{font-size:34px;font-weight:600}
.chart-card{padding:18px 18px 16px}.section-label{font-size:13px;color:var(--sub);margin-bottom:4px;font-weight:600}.chart-area{height:180px;position:relative}.chart-area canvas{width:180px!important;[...]
.legend{display:flex;flex-direction:column;gap:10px;margin-top:4px}.legend-row{display:flex;align-items:center;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;margin-right:8px;flex:none}.ca[...]
.list-wrap{padding:4px 20px}.day-group{margin-bottom:14px}.day-label{font-size:12px;color:var(--sub);margin:6px 4px}.tx-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px [...]
.empty{padding:28px 20px;text-align:center;color:var(--sub);font-size:13px}
.fab{position:fixed;right:max(20px,calc((100vw - 420px)/2 + 20px));bottom:28px;width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-sh[...]
.overlay{position:fixed;inset:0;background:rgba(30,32,28,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:420px;margin:auto;background:var(--card);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0[...]
.date-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.today{font-size:12px;color:var(--deep);background:0;border:0}.wheels{display:flex;justify-content:center;gap[...]
@media(min-width:421px){.fab{right:calc((100vw - 420px)/2 + 20px)}}
</style>
</head>
<body>
<div id="app" class="app">
  <div class="header"><div class="title">Expenses</div><div id="todayText" class="date"></div></div>
  <div class="period-wrap"><div class="period"><button data-period="week">This week</button><button data-period="month" class="active">This month</button></div></div>
  <div class="pad"><div class="card total"><div class="label">Spent this <span id="periodLabel">month</span></div><div id="grandTotal" class="total-num">$0.00</div></div></div>
  <div class="pad"><div class="card chart-card"><div class="section-label">By category</div><div id="chartContent"></div></div></div>
  <div id="list" class="list-wrap"></div>
  <button id="fab" class="fab" aria-label="Add expense">+</button>
</div>

<div id="overlay" class="overlay"></div>
<div id="sheet" class="sheet">
  <div class="handle"></div>
  <div class="sheet-head"><span id="sheetTitle">Add expense</span><button id="close" class="close">×</button></div>
  <div class="sheet-body">
    <div class="amount-entry"><span class="dollar">$</span><input id="amount" class="amount-input" inputmode="decimal" placeholder="0.00"></div>
    <input id="description" class="text-input" placeholder="What was it for?">
    <div class="mini-label">Category</div><div id="chips" class="chips"></div>
    <div class="date-head"><span class="mini-label" style="margin:0">Date</span><button id="todayBtn" class="today">Today</button></div><div id="selectedDateText" style="text-align:center;color:var(--[...]
    <div id="wheels" class="wheels"></div>
    <button id="save" class="save" disabled>Add expense</button>
    <button id="delete" class="delete" style="display:none">Delete expense</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
const CATEGORIES=[
{name:"Groceries",color:"#93C47D",icon:"🛒"},{name:"Transport",color:"#6FA8DC",icon:"🚗"},
{name:"Eating Out",color:"#F6B26B",icon:"🍴"},{name:"Bills",color:"#B4A7D6",icon:"🧾"},
{name:"Rent/Mortgage",color:"#C27BA0",icon:"⌂"},{name:"Shopping",color:"#E8C84A",icon:"🛍️"},
{name:"Health",color:"#E06666",icon:"♥"},{name:"Entertainment",color:"#76A5AF",icon:"🎬"},
{name:"Travel",color:"#6AA84F",icon:"✈️"},{name:"Drinks",color:"#8E7CC3",icon:"🥤"},{name:"Snacks",color:"#F1C232",icon:"🍿"},{name:"Other",color:"#A6A6A6",icon:"•••"}];
const catByName=Object.fromEntries(CATEGORIES.map(c=>[c.name,c]));
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const seed=()=>{const d=new Date(),mk=(offset,category,description,amount)=>{const x=new Date(d);x.setDate(x.getDate()-offset);return{id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),[...]
const fmt=n=>n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const weekStart=d=>{const x=new Date(d),day=x.getDay(),diff=(day===0?-6:1)-day;x.setDate(x.getDate()+diff);x.setHours(0,0,0,0);return x.getTime()};
const dayLabel=s=>{const d=new Date(s+"T00:00:00"),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),diff=Math.round((t-d)/86400000);if(diff===0)return"Today";if(diff===1)return"Yester[...]
let transactions;
try { transactions=JSON.parse(localStorage.getItem("expenses")||"null"); } catch(e) { transactions=null; }
if(!Array.isArray(transactions)){transactions=seed();saveData();}
function saveData(){localStorage.setItem("expenses",JSON.stringify(transactions))}
let period="month",editing=null,chart=null,dateVal={};const $=id=>document.getElementById(id);
$("todayText").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});

function render(){
 const now=new Date(),ws=weekStart(now);
 const filtered=transactions.filter(t=>{const d=new Date(t.date+"T00:00:00");return period==="week"?weekStart(d)===ws:d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()});
 const total=filtered.reduce((s,t)=>s+t.amount,0);$("grandTotal").textContent="$"+fmt(total);$("periodLabel").textContent=period;
 const totals=CATEGORIES.map(c=>({...c,total:filtered.filter(t=>t.category===c.name).reduce((s,t)=>s+t.amount,0)})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
 renderChart(totals,total);renderList(filtered);
 document.querySelectorAll("[data-period]").forEach(b=>b.classList.toggle("active",b.dataset.period===period));
}
function renderChart(totals,total){
 const el=$("chartContent");if(chart){chart.destroy();chart=null}
 if(!total){el.innerHTML='<div class="empty">No expenses in this period yet</div>';return}
 el.innerHTML='<div class="chart-area"><canvas id="donut"></canvas><div class="chart-center"><small>Total</small><strong>$'+fmt(total)+'</strong></div></div><div id="legend" class="legend"></div>';
 chart=new Chart($("donut"),{type:"doughnut",data:{labels:totals.map(x=>x.name),datasets:[{data:totals.map(x=>x.total),backgroundColor:totals.map(x=>x.color),borderWidth:0,spacing:2}]},options:{respon[...]
 $("legend").innerHTML=totals.map(t=>`<div class="legend-row"><span class="dot" style="background:${t.color}"></span><span class="cat-name">${t.name}</span><span class="pct">${Math.round(t.total/total[...]
}
function renderList(filtered){
 const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date));let groups=[];let last=null;
 sorted.forEach(t=>{const l=dayLabel(t.date);if(l!==last){groups.push({label:l,items:[]});last=l}groups.at(-1).items.push(t)});
 $("list").innerHTML=groups.length?groups.map(g=>`<div class="day-group"><div class="day-label">${g.label}</div><div class="tx-card">${g.items.map(t=>{const c=catByName[t.category]||catByName.Other;re[...]
 document.querySelectorAll(".tx").forEach(x=>x.onclick=()=>openSheet(transactions.find(t=>String(t.id)===x.dataset.id)));
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function initDate(d=new Date()){dateVal={year:d.getFullYear(),month:d.getMonth(),day:d.getDate()}}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function updateSelectedDate(){
 const d=new Date(dateVal.year,dateVal.month,dateVal.day);
 $("selectedDateText").textContent=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 const t=new Date(); const isToday=dateVal.year===t.getFullYear()&&dateVal.month===t.getMonth()&&dateVal.day===t.getDate();
 $("todayBtn").textContent=isToday?"Today · "+t.toLocaleDateString(undefined,{day:"numeric",month:"short"}):"Today";
}
let wheelState={};
function updateWheelVisual(sc){
 const center=sc.scrollTop/36;
 [...sc.querySelectorAll(".wheel-item")].forEach((el,i)=>{
  const dist=Math.abs(i-center); el.style.opacity=Math.max(.2,1-dist*.38); el.style.transform=`scale(${Math.max(.80,1-dist*.14)})`; el.style.fontWeight=dist<.35?600:400;
 });
}
function buildWheel(type,items,value){
 const wrap=document.createElement("div");wrap.className="wheel "+type;
 const sc=document.createElement("div");sc.className="wheel-scroll";
 const pad=document.createElement("div");pad.className="wheel-pad";sc.appendChild(pad);
 items.forEach((it,i)=>{const row=document.createElement("div");row.className="wheel-item";row.textContent=it.label;row.dataset.value=it.value;row.addEventListener("click",()=>snapWheel(type,i));sc.ap[...]
 sc.appendChild(pad.cloneNode());wrap.appendChild(sc);
 const line=document.createElement("div");line.className="wheel-line";wrap.appendChild(line);
 wheelState[type]={sc,items,index:Math.max(0,items.findIndex(x=>x.value===value)),timer:null};
 requestAnimationFrame(()=>{sc.scrollTop=wheelState[type].index*36;updateWheelVisual(sc)});
 sc.addEventListener("scroll",()=>{
  updateWheelVisual(sc); const st=wheelState[type]; clearTimeout(st.timer);
  st.timer=setTimeout(()=>{const i=Math.max(0,Math.min(st.items.length-1,Math.round(sc.scrollTop/36)));snapWheel(type,i,true)},100);
 },{passive:true});
 return wrap;
}
function snapWheel(type,index,animated=false){
 const st=wheelState[type];if(!st)return; index=Math.max(0,Math.min(st.items.length-1,index));st.index=index;
 st.sc.scrollTo({top:index*36,behavior:animated?"smooth":"auto"}); updateWheelVisual(st.sc);
 clearTimeout(st.timer); st.timer=setTimeout(()=>applyWheel(type,index),animated?220:0);
}
function applyWheel(type,index){
 const st=wheelState[type]; if(!st || st.index!==index)return;
 const value=st.items[index].value;
 if(type==="month")dateVal.month=value;
 else if(type==="day")dateVal.day=value;
 else dateVal.year=value;
 dateVal.day=Math.min(dateVal.day,daysInMonth(dateVal.year,dateVal.month));
 updateSelectedDate();
 if(type!=="day")renderWheels();
}
function renderWheels(){
 updateSelectedDate(); const container=$("wheels");container.innerHTML="";wheelState={};
 const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map((label,value)=>({label,value}));
 const days=Array.from({length:daysInMonth(dateVal.year,dateVal.month)},(_,i)=>({label:String(i+1),value:i+1}));
 const cy=new Date().getFullYear(), min=Math.min(cy-10,dateVal.year-2), max=Math.max(cy+10,dateVal.year+2);
 const years=Array.from({length:max-min+1},(_,i)=>({label:String(min+i),value:min+i}));
 container.appendChild(buildWheel("month",months,dateVal.month));
 container.appendChild(buildWheel("day",days,dateVal.day));
 container.appendChild(buildWheel("year",years,dateVal.year));
}
function openSheet(tx=null){
 editing=tx||null;initDate();
 if(tx){const [y,m,d]=tx.date.split("-").map(Number);dateVal={year:y,month:m-1,day:d};$("amount").value=tx.amount;$("description").value=tx.description;$("sheetTitle").textContent="Edit expense";$("sa[...]
 renderChips(tx?tx.category:"Groceries");renderWheels();updateSave();$("overlay").classList.add("open");$("sheet").classList.add("open");setTimeout(()=>$("amount").focus(),200)
}
function closeSheet(){$("overlay").classList.remove("open");$("sheet").classList.remove("open");editing=null}
function renderChips(active){$("chips").innerHTML=CATEGORIES.map(c=>`<button class="chip ${c.name===active?"active":""}" data-cat="${c.name}" style="${c.name===active?`border-color:${c.color};backgrou[...]
function updateSave(){const n=parseFloat($("amount").value);$("save").disabled=!(n>0)}
$("amount").addEventListener("input",e=>{e.target.value=e.target.value.replace(/[^0-9.]/g,"");updateSave()});
$("save").onclick=()=>{const amount=parseFloat($("amount").value);if(!(amount>0))return;const d=`${dateVal.year}-${String(dateVal.month+1).padStart(2,"0")}-${String(dateVal.day).padStart(2,"0")}`,cat=[...]
 if(editing){transactions=transactions.map(t=>t.id===editing.id?{...editing,date:d,category:cat,description,amount}:t)}else{transactions.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Ma[...]
 saveData();closeSheet();render()};
$("delete").onclick=()=>{if(editing&&confirm("Delete this expense?")){transactions=transactions.filter(t=>t.id!==editing.id);saveData();closeSheet();render()}};
$("fab").onclick=()=>openSheet();$("close").onclick=closeSheet;$("overlay").onclick=closeSheet;$("todayBtn").onclick=()=>{initDate();renderWheels()};
document.querySelectorAll("[data-period]").forEach(b=>b.onclick=()=>{period=b.dataset.period;render()});
render();
</script>
</body>
</html>
