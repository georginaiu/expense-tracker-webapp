<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Date Picker</title>
  <style>
    :root {
      --row-height: 40px;
      --visible-rows: 5;
      --wheel-height: calc(var(--row-height) * var(--visible-rows));
      --selected-color: #141414;
      --dim-color: #78787d;
      --bg-color: #ffffff;
      --border-color: #e5e5e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
    }

    body {
      background: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .picker-container {
      background: var(--bg-color);
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      padding: 24px;
      width: 100%;
      max-width: 360px;
    }

    .picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .picker-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--selected-color);
    }

    .today-button {
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .today-button:hover {
      background: #0063d1;
    }

    .today-button:active {
      background: #0055b8;
    }

    .wheels-container {
      display: flex;
      gap: 8px;
      position: relative;
    }

    .wheel-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .wheel {
      height: var(--wheel-height);
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      overscroll-behavior: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .wheel::-webkit-scrollbar {
      display: none;
    }

    .wheel-item {
      height: var(--row-height);
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;
      color: var(--dim-color);
      font-size: 17px;
      transition:
        transform 120ms ease,
        opacity 120ms ease,
        color 120ms ease;
      transform: scale(0.9);
      opacity: 0.45;
      user-select: none;
      -webkit-user-select: none;
    }

    .wheel-item.is-selected {
      color: var(--selected-color);
      opacity: 1;
      transform: scale(1);
      font-weight: 500;
    }

    .selection-overlay {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: var(--row-height);
      transform: translateY(-50%);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      pointer-events: none;
      z-index: 1;
    }

    .gradient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0) 25%,
        rgba(255, 255, 255, 0) 75%,
        rgba(255, 255, 255, 0.9) 100%
      );
      z-index: 2;
    }

    .selected-date {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .selected-date-label {
      font-size: 13px;
      color: var(--dim-color);
      margin-bottom: 6px;
    }

    .selected-date-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--selected-color);
    }
  </style>
</head>
<body>
  <div class="picker-container">
    <div class="picker-header">
      <div class="picker-title">Select Date</div>
      <button class="today-button" id="todayButton">Today</button>
    </div>

    <div class="wheels-container">
      <div class="selection-overlay"></div>
      <div class="gradient-overlay"></div>

      <div class="wheel-wrapper">
        <div class="wheel" id="yearWheel"></div>
      </div>

      <div class="wheel-wrapper">
        <div class="wheel" id="monthWheel"></div>
      </div>

      <div class="wheel-wrapper">
        <div class="wheel" id="dayWheel"></div>
      </div>
    </div>

    <div class="selected-date">
      <div class="selected-date-label">Selected Date</div>
      <div class="selected-date-value" id="selectedDateValue">-</div>
    </div>
  </div>

  <script>
    const ROW_HEIGHT = 40;
    const VISIBLE_ROWS = 5;
    const PADDING_ROWS = Math.floor(VISIBLE_ROWS / 2);

    const state = {
      year: new Date().getFullYear(),
      month: new Date().getMonth(),
      day: new Date().getDate(),
      activeWheel: null,
      isCommitting: false
    };

    const monthNames = [
      "Jan", "Feb", "Mar", "Apr", "May", "Jun",
      "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
    ];

    class DateWheel {
      constructor({ element, values, selectedIndex = 0, onCommit, name }) {
        this.element = element;
        this.name = name;
        this.values = values;
        this.onCommit = onCommit;
        this.scrollStopTimer = null;
        this.isSnapping = false;

        this.render(selectedIndex);

        this.element.addEventListener("scroll", () => {
          clearTimeout(this.scrollStopTimer);

          this.scrollStopTimer = setTimeout(() => {
            this.finishScroll();
          }, 120);
        });

        this.element.addEventListener("pointerdown", () => {
          state.activeWheel = this.name;
        });

        this.element.addEventListener("pointerup", () => {
          if (state.activeWheel === this.name) {
            state.activeWheel = null;
          }
        });

        this.element.addEventListener("pointercancel", () => {
          if (state.activeWheel === this.name) {
            state.activeWheel = null;
          }
        });
      }

      getNearestIndex() {
        const scrollTop = this.element.scrollTop;
        const index = Math.round(scrollTop / ROW_HEIGHT);
        return Math.max(0, Math.min(index, this.values.length - 1));
      }

      getValue() {
        const index = this.getNearestIndex();
        return this.values[index];
      }

      scrollToIndex(index, smooth = true) {
        const boundedIndex = Math.max(
          0,
          Math.min(index, this.values.length - 1)
        );

        this.isSnapping = true;

        this.element.scrollTo({
          top: boundedIndex * ROW_HEIGHT,
          behavior: smooth ? "smooth" : "auto"
        });

        this.updateHighlight();

        if (!smooth) {
          this.isSnapping = false;
        }
      }

      scrollToValue(value, smooth = true) {
        const index = this.values.indexOf(value);
        if (index !== -1) {
          this.scrollToIndex(index, smooth);
        }
      }

      setValues(values, { preserveValue = null } = {}) {
        const previousValue = preserveValue ?? this.getValue();
        const previousIndex = this.values.indexOf(previousValue);

        this.values = values;

        const nextIndex =
          previousValue !== null && this.values.includes(previousValue)
            ? this.values.indexOf(previousValue)
            : Math.min(previousIndex, this.values.length - 1);

        this.render(Math.max(0, nextIndex));

        if (previousValue !== null) {
          this.scrollToValue(previousValue, false);
        }
      }

      render(selectedIndex = 0) {
        this.element.replaceChildren();

        const fragment = document.createDocumentFragment();

        for (let i = 0; i < PADDING_ROWS; i++) {
          fragment.appendChild(this.createSpacer());
        }

        for (const value of this.values) {
          fragment.appendChild(this.createItem(value));
        }

        for (let i = 0; i < PADDING_ROWS; i++) {
          fragment.appendChild(this.createSpacer());
        }

        this.element.appendChild(fragment);

        const initialScrollTop = selectedIndex * ROW_HEIGHT;
        this.element.scrollTop = initialScrollTop;

        this.updateHighlight();
        this.isSnapping = false;
      }

      createItem(value) {
        const item = document.createElement("div");
        item.className = "wheel-item";
        item.dataset.value = value;
        item.textContent = value;
        return item;
      }

      createSpacer() {
        const spacer = document.createElement("div");
        spacer.className = "wheel-item";
        spacer.style.visibility = "hidden";
        spacer.style.pointerEvents = "none";
        spacer.textContent = " ";
        return spacer;
      }

      updateHighlight() {
        const selectedIndex = this.getNearestIndex();

        for (const [itemIndex, item] of [
          ...this.element.querySelectorAll(".wheel-item")
        ].entries()) {
          const actualIndex = itemIndex - PADDING_ROWS;
          item.classList.toggle(
            "is-selected",
            actualIndex === selectedIndex
          );
        }
      }

      finishScroll() {
        if (this.isSnapping) return;

        const index = this.getNearestIndex();
        const value = this.values[index];

        this.scrollToIndex(index, true);

        const waitForSnap = () => {
          const targetTop = index * ROW_HEIGHT;
          const reachedTarget =
            Math.abs(this.element.scrollTop - targetTop) < 1;

          if (!reachedTarget) {
            requestAnimationFrame(waitForSnap);
            return;
          }

          this.isSnapping = false;
          this.updateHighlight();
          this.onCommit(value, index);
        };

        requestAnimationFrame(waitForSnap);
      }
    }

    function daysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function createYearValues() {
      const currentYear = new Date().getFullYear();
      const years = [];
      for (let y = currentYear - 50; y <= currentYear + 10; y++) {
        years.push(String(y));
      }
      return years;
    }

    function createMonthValues() {
      return monthNames;
    }

    function createDayValues(maxDay) {
      const days = [];
      for (let d = 1; d <= maxDay; d++) {
        days.push(String(d));
      }
      return days;
    }

    function formatSelectedDate() {
      const year = state.year;
      const month = monthNames[state.month];
      const day = state.day;
      return `${month} ${day}, ${year}`;
    }

    function updateSelectedDateDisplay() {
      document.getElementById("selectedDateValue").textContent =
        formatSelectedDate();
    }

    function commitDate() {
      updateSelectedDateDisplay();
    }

    let yearWheel, monthWheel, dayWheel;

    function initWheels() {
      const yearValues = createYearValues();
      const monthValues = createMonthValues();
      const dayValues = createDayValues(
        daysInMonth(state.year, state.month)
      );

      const yearIndex = yearValues.indexOf(String(state.year));
      const monthIndex = state.month;
      const dayIndex = state.day - 1;

      yearWheel = new DateWheel({
        element: document.getElementById("yearWheel"),
        values: yearValues,
        selectedIndex: Math.max(0, yearIndex),
        onCommit: handleYearCommit,
        name: "year"
      });

      monthWheel = new DateWheel({
        element: document.getElementById("monthWheel"),
        values: monthValues,
        selectedIndex: monthIndex,
        onCommit: handleMonthCommit,
        name: "month"
      });

      dayWheel = new DateWheel({
        element: document.getElementById("dayWheel"),
        values: dayValues,
        selectedIndex: dayIndex,
        onCommit: handleDayCommit,
        name: "day"
      });

      updateSelectedDateDisplay();
    }

    function handleYearCommit(value, index) {
      if (state.activeWheel === "year") return;

      state.year = parseInt(value, 10);

      const maxDay = daysInMonth(state.year, state.month);
      if (state.day > maxDay) {
        state.day = maxDay;
      }

      const newDayValues = createDayValues(maxDay);
      dayWheel.setValues(newDayValues, { preserveValue: String(state.day) });

      commitDate();
    }

    function handleMonthCommit(value, index) {
      if (state.activeWheel === "month") return;

      state.month = monthNames.indexOf(value);

      const maxDay = daysInMonth(state.year, state.month);
      if (state.day > maxDay) {
        state.day = maxDay;
      }

      const newDayValues = createDayValues(maxDay);
      dayWheel.setValues(newDayValues, { preserveValue: String(state.day) });

      commitDate();
    }

    function handleDayCommit(value, index) {
      if (state.activeWheel === "day") return;

      state.day = parseInt(value, 10);
      commitDate();
    }

    document.getElementById("todayButton").addEventListener("click", () => {
      const today = new Date();

      state.year = today.getFullYear();
      state.month = today.getMonth();
      state.day = today.getDate();

      yearWheel.scrollToValue(String(state.year), true);
      monthWheel.scrollToValue(monthNames[state.month], true);
      dayWheel.scrollToValue(String(state.day), true);

      setTimeout(() => {
        commitDate();
      }, 400);
    });

    initWheels();
  </script>
</body>
</html>
