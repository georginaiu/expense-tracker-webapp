<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Expenses</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F4F5F1; }
  body { -webkit-tap-highlight-color: transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useLayoutEffect, useCallback } = React;

// ---------- persistence (browser localStorage) ----------
const storage = {
  async get(key) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? null : { value: v };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (e) {}
    return { value };
  },
};

// ---------- design tokens ----------
const COLORS = {
  bg: "#F4F5F1",
  card: "#FFFFFF",
  ink: "#2B2D28",
  sub: "#9AA096",
  accent: "#7FA687",
  accentDeep: "#5D8566",
  line: "#EDEEE9",
  sheetHandle: "#D8DAD3",
};

const CATEGORIES = [
  { name: "Groceries", color: "#93C47D", emoji: "\u{1F6D2}" },
  { name: "Transport", color: "#6FA8DC", emoji: "\u{1F697}" },
  { name: "Eating Out", color: "#F6B26B", emoji: "\u{1F37D}\uFE0F" },
  { name: "Bills", color: "#B4A7D6", emoji: "\u{1F9FE}" },
  { name: "Rent/Mortgage", color: "#C27BA0", emoji: "\u{1F3E0}" },
  { name: "Shopping", color: "#E8C84A", emoji: "\u{1F6CD}\uFE0F" },
  { name: "Health", color: "#E06666", emoji: "\u{1F48A}" },
  { name: "Entertainment", color: "#76A5AF", emoji: "\u{1F3AC}" },
  { name: "Travel", color: "#6AA84F", emoji: "\u2708\uFE0F" },
  { name: "Other", color: "#A6A6A6", emoji: "\u{1F518}" },
];
const catByName = Object.fromEntries(CATEGORIES.map((c) => [c.name, c]));

const seedData = () => {
  const d = new Date();
  const mk = (offset, category, description, amount) => {
    const dt = new Date(d);
    dt.setDate(dt.getDate() - offset);
    return {
      id: `${dt.getTime()}-${Math.random().toString(36).slice(2, 7)}`,
      date: `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(
        dt.getDate()
      ).padStart(2, "0")}`,
      category,
      description,
      amount,
    };
  };
  return [
    mk(0, "Eating Out", "Coffee with Sam", 6.5),
    mk(1, "Transport", "Petrol", 45.0),
    mk(2, "Groceries", "Coles weekly shop", 84.5),
    mk(6, "Bills", "Phone bill", 55.0),
    mk(9, "Shopping", "New sneakers", 129.0),
  ];
};

function fmt(n) {
  return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getWeekStart(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

function dayLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((today - that) / 86400000);
  if (diffDays === 0) return "Today";
  if (diffDays === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}

// ---------- iOS-style wheel picker ----------
const ITEM_H = 36;
const VISIBLE = 5;
const PAD = ITEM_H * Math.floor(VISIBLE / 2);

function WheelColumn({ items, value, onChange, width }) {
  const ref = useRef(null);
  const timeoutRef = useRef(null);
  const [scrollTop, setScrollTop] = useState(0);

  const selectedIndex = Math.max(0, items.findIndex((it) => it.value === value));

  useLayoutEffect(() => {
    if (ref.current) {
      ref.current.scrollTop = selectedIndex * ITEM_H;
      setScrollTop(selectedIndex * ITEM_H);
    }
    // eslint-disable-next-line
  }, [items.length]);

  useEffect(() => {
    if (ref.current) {
      const target = selectedIndex * ITEM_H;
      if (Math.abs(ref.current.scrollTop - target) > ITEM_H / 2) {
        ref.current.scrollTop = target;
        setScrollTop(target);
      }
    }
    // eslint-disable-next-line
  }, [value]);

  const handleScroll = useCallback(
    (e) => {
      const st = e.target.scrollTop;
      setScrollTop(st);
      clearTimeout(timeoutRef.current);
      timeoutRef.current = setTimeout(() => {
        const idx = Math.max(0, Math.min(items.length - 1, Math.round(st / ITEM_H)));
        if (items[idx] && items[idx].value !== value) onChange(items[idx].value);
        if (ref.current) ref.current.scrollTop = idx * ITEM_H;
      }, 100);
    },
    [items, value, onChange]
  );

  return (
    <div style={{ position: "relative", width, height: ITEM_H * VISIBLE }}>
      <div
        ref={ref}
        onScroll={handleScroll}
        className="no-scrollbar"
        style={{
          height: "100%",
          overflowY: "scroll",
          scrollSnapType: "y mandatory",
          WebkitOverflowScrolling: "touch",
          scrollbarWidth: "none",
        }}
      >
        <div style={{ height: PAD }} />
        {items.map((it, i) => {
          const dist = i - scrollTop / ITEM_H;
          const opacity = Math.max(0.2, 1 - Math.abs(dist) * 0.38);
          const scale = Math.max(0.78, 1 - Math.abs(dist) * 0.14);
          return (
            <div
              key={it.value}
              style={{
                height: ITEM_H,
                scrollSnapAlign: "center",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: 18,
                fontWeight: Math.abs(dist) < 0.3 ? 600 : 400,
                color: COLORS.ink,
                opacity,
                transform: `scale(${scale})`,
              }}
            >
              {it.label}
            </div>
          );
        })}
        <div style={{ height: PAD }} />
      </div>
      <div
        style={{
          position: "absolute",
          top: PAD,
          left: 0,
          right: 0,
          height: ITEM_H,
          borderTop: `1px solid ${COLORS.line}`,
          borderBottom: `1px solid ${COLORS.line}`,
          pointerEvents: "none",
        }}
      />
    </div>
  );
}

function DateWheel({ value, onChange }) {
  const months = [
    "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
  ].map((label, i) => ({ label, value: i }));

  const daysInMonth = new Date(value.year, value.month + 1, 0).getDate();
  const days = Array.from({ length: daysInMonth }, (_, i) => ({ label: String(i + 1), value: i + 1 }));

  const thisYear = new Date().getFullYear();
  const years = Array.from({ length: 6 }, (_, i) => thisYear - 3 + i).map((y) => ({
    label: String(y),
    value: y,
  }));

  const setMonth = (m) => {
    const dim = new Date(value.year, m + 1, 0).getDate();
    onChange({ ...value, month: m, day: Math.min(value.day, dim) });
  };
  const setDay = (d) => onChange({ ...value, day: d });
  const setYear = (y) => {
    const dim = new Date(y, value.month + 1, 0).getDate();
    onChange({ ...value, year: y, day: Math.min(value.day, dim) });
  };

  return (
    <div style={{ display: "flex", justifyContent: "center", gap: 4 }}>
      <WheelColumn items={months} value={value.month} onChange={setMonth} width={90} />
      <WheelColumn items={days} value={value.day} onChange={setDay} width={64} />
      <WheelColumn items={years} value={value.year} onChange={setYear} width={80} />
    </div>
  );
}

// ---------- Add / edit expense sheet ----------
function AddExpenseSheet({ open, onClose, onAdd, onSaveEdit, onDelete, editing }) {
  const now = new Date();
  const isEditing = !!editing;
  const [amount, setAmount] = useState("");
  const [category, setCategory] = useState("Groceries");
  const [description, setDescription] = useState("");
  const [dateVal, setDateVal] = useState({ year: now.getFullYear(), month: now.getMonth(), day: now.getDate() });

  useEffect(() => {
    if (open) {
      if (editing) {
        const [y, m, d] = editing.date.split("-").map(Number);
        setAmount(String(editing.amount));
        setCategory(editing.category);
        setDescription(editing.description);
        setDateVal({ year: y, month: m - 1, day: d });
      } else {
        const n = new Date();
        setAmount("");
        setCategory("Groceries");
        setDescription("");
        setDateVal({ year: n.getFullYear(), month: n.getMonth(), day: n.getDate() });
      }
    }
  }, [open, editing]);

  const handleSave = () => {
    const num = parseFloat(amount);
    if (!num || num <= 0) return;
    const dateStr = `${dateVal.year}-${String(dateVal.month + 1).padStart(2, "0")}-${String(dateVal.day).padStart(2, "0")}`;
    if (isEditing) {
      onSaveEdit({ ...editing, date: dateStr, category, description: description.trim() || category, amount: num });
    } else {
      onAdd({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
        date: dateStr,
        category,
        description: description.trim() || category,
        amount: num,
      });
    }
    onClose();
  };

  const handleDelete = () => {
    if (editing) onDelete(editing.id);
    onClose();
  };

  const setToday = () => {
    const n = new Date();
    setDateVal({ year: n.getFullYear(), month: n.getMonth(), day: n.getDate() });
  };

  return (
    <>
      <div
        onClick={onClose}
        style={{
          position: "fixed",
          inset: 0,
          background: "rgba(30,32,28,0.35)",
          opacity: open ? 1 : 0,
          pointerEvents: open ? "auto" : "none",
          transition: "opacity 0.25s ease",
          zIndex: 40,
        }}
      />
      <div
        style={{
          position: "fixed",
          left: 0,
          right: 0,
          bottom: 0,
          maxWidth: 420,
          margin: "0 auto",
          background: COLORS.card,
          borderTopLeftRadius: 24,
          borderTopRightRadius: 24,
          transform: open ? "translateY(0)" : "translateY(100%)",
          transition: "transform 0.32s cubic-bezier(0.32, 0.72, 0, 1)",
          zIndex: 41,
          maxHeight: "72vh",
          display: "flex",
          flexDirection: "column",
          boxShadow: "0 -8px 30px rgba(0,0,0,0.12)",
        }}
      >
        <div style={{ display: "flex", justifyContent: "center", paddingTop: 10 }}>
          <div style={{ width: 36, height: 4, borderRadius: 2, background: COLORS.sheetHandle }} />
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 20px 6px" }}>
          <span style={{ fontSize: 17, fontWeight: 600, color: COLORS.ink }}>
            {isEditing ? "Edit expense" : "Add expense"}
          </span>
          <button
            onClick={onClose}
            style={{
              width: 28, height: 28, borderRadius: 14, background: COLORS.bg, border: "none",
              display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, color: COLORS.sub,
              lineHeight: 1, cursor: "pointer",
            }}
          >
            &times;
          </button>
        </div>

        <div style={{ overflowY: "auto", padding: "4px 20px 20px" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "center", padding: "18px 0 8px" }}>
            <span style={{ fontSize: 30, color: COLORS.sub, marginRight: 4 }}>$</span>
            <input
              autoFocus
              inputMode="decimal"
              placeholder="0.00"
              value={amount}
              onChange={(e) => setAmount(e.target.value.replace(/[^0-9.]/g, ""))}
              style={{
                fontSize: 44, fontWeight: 600, color: COLORS.ink, border: "none", outline: "none",
                background: "transparent", width: 180, textAlign: "left",
              }}
            />
          </div>

          <input
            placeholder="What was it for?"
            value={description}
            onChange={(e) => setDescription(e.target.value)}
            style={{
              width: "100%", border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: "10px 14px",
              fontSize: 15, color: COLORS.ink, outline: "none", marginBottom: 16, boxSizing: "border-box",
            }}
          />

          <div style={{ fontSize: 12, color: COLORS.sub, marginBottom: 8 }}>Category</div>
          <div className="no-scrollbar" style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 6, marginBottom: 16 }}>
            {CATEGORIES.map((c) => {
              const active = c.name === category;
              return (
                <button
                  key={c.name}
                  onClick={() => setCategory(c.name)}
                  style={{
                    flex: "0 0 auto", display: "flex", alignItems: "center", gap: 6, padding: "8px 12px",
                    borderRadius: 999, border: active ? `1.5px solid ${c.color}` : `1px solid ${COLORS.line}`,
                    background: active ? `${c.color}22` : COLORS.card, whiteSpace: "nowrap", cursor: "pointer",
                  }}
                >
                  <span style={{ fontSize: 15 }}>{c.emoji}</span>
                  <span style={{ fontSize: 13, color: COLORS.ink, fontWeight: active ? 600 : 400 }}>{c.name}</span>
                </button>
              );
            })}
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 12, color: COLORS.sub }}>Date</span>
            <button onClick={setToday} style={{ fontSize: 12, color: COLORS.accentDeep, background: "none", border: "none", cursor: "pointer" }}>
              Today
            </button>
          </div>
          <DateWheel value={dateVal} onChange={setDateVal} />

          <button
            onClick={handleSave}
            disabled={!amount || parseFloat(amount) <= 0}
            style={{
              width: "100%", marginTop: 20, padding: "14px 0", borderRadius: 14, border: "none",
              background: !amount || parseFloat(amount) <= 0 ? COLORS.line : COLORS.accent,
              color: !amount || parseFloat(amount) <= 0 ? COLORS.sub : "#fff",
              fontSize: 16, fontWeight: 600, cursor: "pointer",
            }}
          >
            {isEditing ? "Save changes" : "Add expense"}
          </button>

          {isEditing && (
            <button
              onClick={handleDelete}
              style={{
                width: "100%", marginTop: 10, padding: "12px 0", borderRadius: 14, border: "none",
                background: "transparent", color: "#C0504D", fontSize: 14, fontWeight: 600, cursor: "pointer",
              }}
            >
              Delete expense
            </button>
          )}
        </div>
      </div>
    </>
  );
}

// ---------- hand-rolled SVG donut (no chart library needed) ----------
function CategoryDonut({ totals, grandTotal }) {
  if (grandTotal === 0) {
    return <div style={{ textAlign: "center", padding: "30px 0", color: COLORS.sub, fontSize: 13 }}>No expenses in this period yet</div>;
  }
  const size = 180, r = 70, cx = 90, cy = 90, stroke = 20;
  const circumference = 2 * Math.PI * r;
  let cumulative = 0;
  const segments = totals.map((t) => {
    const fraction = t.total / grandTotal;
    const dash = fraction * circumference;
    const seg = { color: t.color, dash, offset: cumulative };
    cumulative += dash;
    return seg;
  });

  return (
    <div>
      <div style={{ position: "relative", width: size, height: size, margin: "0 auto" }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <g transform={`rotate(-90 ${cx} ${cy})`}>
            <circle cx={cx} cy={cy} r={r} fill="none" stroke={COLORS.line} strokeWidth={stroke} />
            {segments.map((s, i) => (
              <circle
                key={i}
                cx={cx} cy={cy} r={r} fill="none"
                stroke={s.color}
                strokeWidth={stroke}
                strokeDasharray={`${s.dash} ${circumference - s.dash}`}
                strokeDashoffset={-s.offset}
                strokeLinecap="butt"
              />
            ))}
          </g>
        </svg>
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontSize: 11, color: COLORS.sub }}>Total</span>
          <span style={{ fontSize: 20, fontWeight: 600, color: COLORS.ink }}>${fmt(grandTotal)}</span>
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 16 }}>
        {totals.map((t) => (
          <div key={t.name} style={{ display: "flex", alignItems: "center", fontSize: 13 }}>
            <span style={{ width: 8, height: 8, borderRadius: 4, background: t.color, marginRight: 8, flex: "0 0 auto" }} />
            <span style={{ color: COLORS.ink, flex: 1 }}>{t.name}</span>
            <span style={{ color: COLORS.sub, marginRight: 8 }}>{Math.round((t.total / grandTotal) * 100)}%</span>
            <span style={{ color: COLORS.ink, fontWeight: 600 }}>${fmt(t.total)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- Main app ----------
function ExpenseTrackerApp() {
  const [transactions, setTransactions] = useState([]);
  const [ready, setReady] = useState(false);
  const [period, setPeriod] = useState("month");
  const [sheetOpen, setSheetOpen] = useState(false);
  const [editingTx, setEditingTx] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("expenses");
        if (res && res.value) {
          setTransactions(JSON.parse(res.value));
        } else {
          const seed = seedData();
          setTransactions(seed);
          await storage.set("expenses", JSON.stringify(seed));
        }
      } catch (e) {
        setTransactions(seedData());
      }
      setReady(true);
    })();
  }, []);

  const persist = async (list) => {
    setTransactions(list);
    try {
      await storage.set("expenses", JSON.stringify(list));
    } catch (e) {}
  };

  const addExpense = (expense) => persist([expense, ...transactions]);
  const saveEditedExpense = (updated) => persist(transactions.map((t) => (t.id === updated.id ? updated : t)));
  const deleteExpense = (id) => persist(transactions.filter((t) => t.id !== id));

  const openAdd = () => { setEditingTx(null); setSheetOpen(true); };
  const openEdit = (tx) => { setEditingTx(tx); setSheetOpen(true); };

  const now = new Date();
  const weekStart = getWeekStart(now).getTime();

  const filtered = transactions.filter((t) => {
    const td = new Date(t.date + "T00:00:00");
    if (period === "week") return getWeekStart(td).getTime() === weekStart;
    return td.getFullYear() === now.getFullYear() && td.getMonth() === now.getMonth();
  });

  const grandTotal = filtered.reduce((s, t) => s + t.amount, 0);

  const totalsByCategory = CATEGORIES.map((c) => ({
    name: c.name,
    color: c.color,
    total: filtered.filter((t) => t.category === c.name).reduce((s, t) => s + t.amount, 0),
  })).filter((c) => c.total > 0).sort((a, b) => b.total - a.total);

  const sortedList = [...filtered].sort((a, b) => (a.date < b.date ? 1 : -1));
  const grouped = [];
  let lastLabel = null;
  sortedList.forEach((t) => {
    const label = dayLabel(t.date);
    if (label !== lastLabel) { grouped.push({ label, items: [] }); lastLabel = label; }
    grouped[grouped.length - 1].items.push(t);
  });

  if (!ready) {
    return <div style={{ minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <span style={{ color: COLORS.sub, fontSize: 13 }}>Loading&hellip;</span>
    </div>;
  }

  return (
    <div style={{
      minHeight: "100vh", background: COLORS.bg,
      fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif",
      maxWidth: 420, margin: "0 auto", position: "relative", paddingBottom: 100,
    }}>
      <div style={{ padding: "24px 20px 8px" }}>
        <div style={{ fontSize: 22, color: COLORS.ink, fontWeight: 600 }}>Expenses</div>
        <div style={{ fontSize: 13, color: COLORS.sub, marginTop: 2 }}>
          {now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}
        </div>
      </div>

      <div style={{ padding: "8px 20px" }}>
        <div style={{ display: "inline-flex", background: COLORS.card, borderRadius: 999, padding: 3, border: `1px solid ${COLORS.line}` }}>
          {["week", "month"].map((p) => (
            <button
              key={p}
              onClick={() => setPeriod(p)}
              style={{
                padding: "6px 16px", borderRadius: 999, border: "none",
                background: period === p ? COLORS.accent : "transparent",
                color: period === p ? "#fff" : COLORS.sub,
                fontSize: 13, fontWeight: 600, textTransform: "capitalize", cursor: "pointer",
              }}
            >
              This {p}
            </button>
          ))}
        </div>
      </div>

      <div style={{ padding: "12px 20px" }}>
        <div style={{ background: COLORS.card, borderRadius: 20, padding: "20px 20px", boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
          <div style={{ fontSize: 12, color: COLORS.sub, marginBottom: 4 }}>Spent this {period}</div>
          <div style={{ fontSize: 34, fontWeight: 600, color: COLORS.ink }}>${fmt(grandTotal)}</div>
        </div>
      </div>

      <div style={{ padding: "0 20px 12px" }}>
        <div style={{ background: COLORS.card, borderRadius: 20, padding: "18px 18px 16px", boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
          <div style={{ fontSize: 13, color: COLORS.sub, marginBottom: 4, fontWeight: 600 }}>By category</div>
          <CategoryDonut totals={totalsByCategory} grandTotal={grandTotal} />
        </div>
      </div>

      <div style={{ padding: "4px 20px" }}>
        {grouped.length === 0 && (
          <div style={{ background: COLORS.card, borderRadius: 20, padding: "28px 20px", textAlign: "center", color: COLORS.sub, fontSize: 13 }}>
            Nothing logged this {period} yet. Tap + to add your first expense.
          </div>
        )}
        {grouped.map((g) => (
          <div key={g.label} style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 12, color: COLORS.sub, margin: "6px 4px" }}>{g.label}</div>
            <div style={{ background: COLORS.card, borderRadius: 18, overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
              {g.items.map((t, i) => {
                const c = catByName[t.category] || catByName.Other;
                return (
                  <div
                    key={t.id}
                    onClick={() => openEdit(t)}
                    style={{
                      display: "flex", alignItems: "center", padding: "12px 14px",
                      borderBottom: i === g.items.length - 1 ? "none" : `1px solid ${COLORS.line}`,
                      cursor: "pointer",
                    }}
                  >
                    <div style={{
                      width: 36, height: 36, borderRadius: 12, background: `${c.color}22`,
                      display: "flex", alignItems: "center", justifyContent: "center", marginRight: 12, flex: "0 0 auto", fontSize: 16,
                    }}>
                      {c.emoji}
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14, color: COLORS.ink, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                        {t.description}
                      </div>
                      <div style={{ fontSize: 12, color: COLORS.sub }}>{t.category}</div>
                    </div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.ink, marginRight: 4 }}>${fmt(t.amount)}</div>
                    <span style={{ color: COLORS.line, fontSize: 14 }}>&rsaquo;</span>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      <button
        onClick={openAdd}
        style={{
          position: "fixed", right: 20, bottom: 28, width: 56, height: 56, borderRadius: 28,
          background: COLORS.accent, border: "none", display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 6px 16px rgba(93,133,102,0.4)", zIndex: 30, cursor: "pointer", fontSize: 28, color: "#fff", lineHeight: 1,
        }}
      >
        +
      </button>

      <AddExpenseSheet
        open={sheetOpen}
        onClose={() => setSheetOpen(false)}
        onAdd={addExpense}
        onSaveEdit={saveEditedExpense}
        onDelete={deleteExpense}
        editing={editingTx}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ExpenseTrackerApp />);
</script>
</body>
</html>
